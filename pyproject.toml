[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sala-agent"
version = "0.1.0a1"
description = "sala experimental media-agent vertical slice"
requires-python = ">=3.11"

[project.scripts]
sala = "sala.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
