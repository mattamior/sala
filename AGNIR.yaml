agnir:
  version: "1.0"
  discovery_profile: "repository-filesystem/1.0"

project:
  identity: "urn:github:mattamior:sala"

continuity:
  lineage: "urn:agnir:sala:initial"

memory:
  state: ".agnir/state.md"
  next_actions: ".agnir/next-actions.md"
  decisions: ".agnir/decisions.md"
  evidence: ".agnir/evidence/"

policy:
  checkpoint: event-driven

extensions:
  agnir/repository:
    canonical: "mattamior/sala"
    authoritative_ref: "refs/heads/main"
  agnir/vcs:
    branch_continuity: "lineage-bound"
    lineage_binding:
      kind: "vcs-ref"
      selector: "refs/heads/main"
  agnir/operations:
    distribution: "agnir-agent-skill"
    release: "1.0.2"
    source: "iorLab/agnir"
    applied_revision: "b5626394ec40a5cb7a28c01892acde07cc0adc8e"
